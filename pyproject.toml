[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vnpy-domestic"
version = "0.1.2"
description = "面向国内期货的 vnpy 增强扩展包"
requires-python = ">=3.10"
dependencies = [
    "vnpy",
    "numpy",
    "pandas",
    "akshare",
    "requests",
    "psutil",
    "pyyaml",
    "lark-oapi",
    "fastapi",
    "uvicorn",
]

[tool.setuptools.packages.find]
include = ["vnpy_domestic*"]
