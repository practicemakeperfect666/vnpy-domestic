[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vnpy-domestic"
version = "0.2.2"
description = "面向国内期货的 vnpy 增强扩展包"
requires-python = ">=3.10"
dependencies = [
    "vnpy>=4.3.0",
    "vnpy_ctastrategy>=1.4.1",
    "vnpy_ctp>=6.7.11.4",
    "vnpy_sqlite>=1.1.3",
    "numpy",
    "pandas",
    "akshare",
    "requests",
    "psutil",
    "pyyaml",
    "lark-oapi",
    "fastapi",
    "uvicorn",
    "sqlalchemy",
]

[tool.setuptools.packages.find]
include = ["vnpy_domestic*"]

# ────────────────────────── ruff ──────────────────────────
# 代码风格基线。设计取舍见各 ignore 注释。
[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".vntrader", "*.bak.*", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PIE", "ISC"]
ignore = [
    # 全程使用北京时间 naive 时间（数据库、换月表、trading_times.csv 都是 naive
    # 字符串），改成 tz-aware 要牵动整条链路，收益为零。
    "DTZ",
    # 中文注释/字符串里的全角标点（：（））本来就是对的。
    "RUF001",
    "RUF002",
    "RUF003",
    # 交易系统里单个事件异常不能让事件线程死掉，统一用 except Exception 兜底；
    # 关键路径是否吞掉了错误已逐个审过。
    "BLE001",
    "S110",
    "S112",
    # 脚本/包里有 sys.path 注入与延迟导入，import 不一定在文件最顶部。
    "E402",
]

[tool.ruff.lint.per-file-ignores]
# vnpy 生态惯例：引擎模块目录用 CamelCase（vnpy 自己的 vnpy_ctastrategy 也是）。
"vnpy_domestic/RolloverCtaEngine/*" = ["N999"]
"tests/*" = ["RUF012"]
"scripts/*" = ["RUF012"]
